name: LASVision
options:
  bundleIdPrefix: local.lasrecomp
schemes:
  LASVision:
    build:
      targets:
        LASVision: all
    run:
      config: Debug
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_OPTIMIZATION_LEVEL: 1
    GCC_STRICT_ALIASING: NO
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - LARECOMP_VISIONOS=1
      - GAMELIB_ID=\"vision-local-v1\"
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../runtime
      - $(SRCROOT)/../runtime/nvn
      - $(SRCROOT)/../third_party/imgui
      - $(SRCROOT)/../third_party/imgui/backends
      - $(SRCROOT)/../../deps-$(PLATFORM_NAME)/include
      - $(SRCROOT)/../third_party/smaa/Textures
      - $(SRCROOT)/../build/inc
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/../../deps-$(PLATFORM_NAME)/lib
    OTHER_LDFLAGS:
      - $(inherited)
      - -lSDL3
      - -lavformat
      - -lavcodec
      - -lavutil
      - -lswscale
      - -lz
      - -liconv
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEBUG_INFORMATION_FORMAT: dwarf
    ONLY_ACTIVE_ARCH: YES
    ARCHS: arm64
targets:
  LASVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ../runtime
        excludes: [platform, nvn/vulkan]
      - path: ../runtime/platform/visionos.c
      - path: ../generated
        compilerFlags: -Wno-return-type -Wno-unused-label -fvisibility=hidden
      - path: ../tools/gamelib_entry.c
      - path: ../third_party/imgui
        includes: [imgui.cpp, imgui_draw.cpp, imgui_tables.cpp, imgui_widgets.cpp]
      - path: ../third_party/imgui/backends/imgui_impl_sdl3.cpp
      - path: ../third_party/imgui/backends/imgui_impl_metal.mm
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: ImageIO.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.lasrecomp.vision
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LAS Vision
        TARGETED_DEVICE_FAMILY: "7"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    postBuildScripts:
      - name: Stage private game resources
        script: /usr/bin/python3 "$SRCROOT/stage_game.py" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SDLUIKitSceneDelegate
